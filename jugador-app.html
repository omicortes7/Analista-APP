<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Areté Academy — Redirigiendo…</title>

<!--
  ╔═══════════════════════════════════════════════════════════════════╗
  ║  REDIRECT LEGACY                                                   ║
  ║  Este archivo existía con el login viejo (email + password).      ║
  ║  Lo dejamos como redirect para que cualquier link viejo que       ║
  ║  esté circulando por WhatsApp/email caiga en el login nuevo       ║
  ║  por PIN sin volver a fallar.                                     ║
  ║  Conserva query string (?id=…) y hash si los hay.                 ║
  ╚═══════════════════════════════════════════════════════════════════╝
-->

<!-- Redirect inmediato (sin necesidad de JS) -->
<meta http-equiv="refresh" content="0; url=./jugador.html">

<link rel="canonical" href="./jugador.html">

<style>
  html,body{
    margin:0;padding:0;height:100%;
    background:radial-gradient(ellipse at center,#1a1530 0%,#0a0814 100%);
    color:#e8e3ff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .card{
    text-align:center;
    padding:2.5rem 2rem;
    max-width:420px;
    animation:fadeIn .4s ease;
  }
  .logo{
    font-size:2rem;
    font-weight:300;
    letter-spacing:.4em;
    color:#c8b8ff;
    margin-bottom:.5rem;
    text-transform:uppercase;
  }
  .sub{
    font-size:.78rem;
    letter-spacing:.3em;
    color:#7c6ff0;
    text-transform:uppercase;
    margin-bottom:2.5rem;
    opacity:.8;
  }
  .spinner{
    width:32px;height:32px;
    border:2px solid rgba(200,184,255,.15);
    border-top-color:#c8b8ff;
    border-radius:50%;
    margin:0 auto 1.5rem;
    animation:spin .9s linear infinite;
  }
  .msg{
    font-size:.95rem;
    color:#a59ed4;
    line-height:1.5;
  }
  .fallback{
    margin-top:2rem;
    font-size:.85rem;
  }
  .fallback a{
    color:#c8b8ff;
    text-decoration:underline;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Areté</div>
    <div class="sub">Academy</div>
    <div class="spinner"></div>
    <div class="msg">Llevándote a tu panel…</div>
    <div class="fallback">
      Si no se redirige automáticamente,<br>
      <a href="./jugador.html">pulsa aquí</a>.
    </div>
  </div>

<script>
  // Redirect por JS (más rápido que el meta-refresh, y conserva ?id=… y #hash)
  (function(){
    var target = './jugador.html' + (location.search || '') + (location.hash || '');
    // location.replace para que NO quede en el historial — al pulsar atrás vuelve al chat
    location.replace(target);
  })();
</script>
</body>
</html>
